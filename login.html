<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Muebles Nova</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <header></header>

    <main class="container">
        <div class="login-container animacion-entrada">
            <h2 class="text-center mb-4 fw-bold">Bienvenido</h2>
            <p class="text-center text-muted mb-4">Ingresa tus credenciales para continuar</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" required placeholder="tu@email.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-dark w-100">Iniciar Sesión</button>
                <div id="mensajeError" class="text-danger text-center mt-3" style="display: none;"></div>
                <div class="text-center mt-3">
                    <span class="text-muted">¿No tienes una cuenta? </span>
                    <a href="registro.html" class="text-dark fw-bold text-decoration-none">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </main>

    <footer></footer>

    <script src="script/shared.js"></script>
    <script src="script/script_login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>

</html>
