<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Muebles Nova</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header></header>

    <main class="main-container">
        <div id="app" class="d-flex gap-4 w-100">
            <aside class="sidebar">
                <ul>
                    <li :class="{ active: categoriaSeleccionada === 'Todos los productos' }" @click="filtrarPorCategoria('Todos los productos')">Todos los productos</li>
                    <li :class="{ active: categoriaSeleccionada === 'Oficina' }" @click="filtrarPorCategoria('Oficina')">Oficina</li>
                    <li :class="{ active: categoriaSeleccionada === 'Salas' }" @click="filtrarPorCategoria('Salas')">Salas</li>
                    <li :class="{ active: categoriaSeleccionada === 'Comedores' }" @click="filtrarPorCategoria('Comedores')">Comedores</li>
                </ul>
            </aside>

            <div v-if="alertaVisible"
                class="alert alert-success position-fixed top-0 start-50 translate-middle-x mt-4 shadow-lg d-flex align-items-center"
                style="z-index: 2000; min-width: 350px; border-radius: 12px;" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                    class="bi bi-check-circle-fill me-3" viewBox="0 0 16 16">
                    <path
                        d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
                </svg>
                <div>{{ mensajeAlerta }}</div>
            </div>
            <div class="row w-100">
                <div class="col-md-6 col-lg-4 mb-4 animacion-entrada" v-for="(producto, index) in productosFiltrados"
                    :key="producto.id" :style="{ 'animation-delay': (index * 0.1) + 's' }">

                    <article class="card h-100 border-0 shadow-sm overflow-hidden tarjeta-mueble">
                        <div class="imagen-contenedor position-relative">
                            <img :src="producto.img" :alt="producto.nombre">

                            <span v-if="producto.enOferta"
                                class="badge bg-dark position-absolute top-0 start-0 m-3 shadow">
                                Oferta
                            </span>
                        </div>

                        <div class="card-body text-center d-flex flex-column">
                            <h2 class="card-title h5 text-dark mb-2 fw-bold">{{ producto.nombre }}</h2>
                            <p class="precio mb-3">${{ producto.precio.toLocaleString('es-MX') }}</p>
                            <button @click="agregarAlCarrito(producto)" class="btn btn-dark w-100 rounded-pill mt-auto">
                                Agregar al carrito
                            </button>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="script/shared.js"></script>
    <script src="script/script_catalogo.js"></script>
</body>

</html>
