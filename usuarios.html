<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Muebles Nova</title>
    <link rel="stylesheet" href="https://julian12pm.github.io/FORMULARIO-CSS/Formulario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        [v-cloak] { display: none !important; }
    </style>
</head>
<body>
<div id="app" v-cloak>
    <header></header>
    <main>
        <div class="form-container">
            <h2>Gestión de Usuarios</h2>
            <form @submit.prevent="gestionarUsuario">
                <div class="mb-3">
                    <label>Operación</label>
                    <select class="form-control" v-model="form.operacion" required>
                        <option value="">Selecciona</option>
                        <option>Alta</option>
                        <option>Modificación</option>
                        <option>Eliminación</option>
                    </select>
                </div>
                <div class="mb-3" v-if="form.operacion !== 'Alta'">
                    <label>ID Usuario</label>
                    <div class="d-flex gap-2">
                        <input type="number" class="form-control" v-model="form.id_usuario">
                        <button type="button" class="btn btn-outline-primary" 
                            v-if="form.operacion === 'Modificación'" 
                            @click="buscarUsuario" 
                            :disabled="cargandoUsuario">
                            {{ cargandoUsuario ? 'Buscando...' : 'Buscar' }}
                        </button>
                    </div>
                    <div class="text-success small mt-1" v-if="datosOriginales && form.operacion === 'Modificación'">✓ Usuario cargado — modifica los campos que necesites</div>
                </div>
                <div v-if="form.operacion !== 'Eliminación'">
                    <div class="mb-3">
                        <label>Nombre</label>
                        <input type="text" class="form-control" v-model="form.nombre" required>
                    </div>
                    <div class="mb-3">
                        <label>Apellido</label>
                        <input type="text" class="form-control" v-model="form.apellido" required>
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" v-model="form.email" required>
                    </div>
                    <div class="mb-3" v-if="form.operacion === 'Alta'">
                        <label>Contraseña</label>
                        <input type="password" class="form-control" v-model="form.password" required>
                    </div>
                    <div class="mb-3">
                        <label>Rol</label>
                        <select class="form-control" v-model="form.rol">
                            <option value="cliente">Cliente</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100">Ejecutar {{form.operacion}}</button>
            </form>
        </div>

        <!-- Alerta Flotante Estilo Catálogo -->
        <div v-if="alertaVisible"
            :class="'alert ' + alertaClase + ' position-fixed top-0 start-50 translate-middle-x mt-4 shadow-lg d-flex align-items-center'"
            style="z-index: 2000; min-width: 350px; border-radius: 12px;" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                class="bi bi-check-circle-fill me-3" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
            </svg>
            <div>{{ mensajeAlerta }}</div>
        </div>
    </main>
    <footer></footer>
</div>
<script src="https://unpkg.com/vue@3"></script>
<script src="script/shared.js"></script>
<script src="script/script_usuarios.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
