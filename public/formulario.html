<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Muebles Nova</title>

    <link rel="stylesheet" href="https://julian12pm.github.io/FORMULARIO-CSS/Formulario.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    </style>
</head>

<body>

    <header>
        <h1>Administración de Productos</h1>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
                <li><a href="catalogo.html">Ir al Catálogo</a></li>
            </ul>
        </nav>
    </header>

    <main id="app"></main>

    <script type="text/x-template" id="app-template">
        <div class="form-container">
            <h1>Gestión de Productos</h1>

            <form @submit.prevent="validarFormulario">

                <div class="form-group mb-3">
                    <label>Tipo de operación</label>
                    <select class="form-control" v-model="form.operacion" required>
                        <option value="">Selecciona</option>
                        <option>Alta</option>
                        <option>Modificación</option>
                        <option>Eliminación</option>
                    </select>
                </div>

                <div class="form-group mb-3" v-if="form.operacion !== 'Alta'">
                    <label>ID del Mueble</label>
                    <div class="d-flex gap-2">
                        <input type="number" class="form-control" v-model="form.id_mueble" placeholder="Ingrese el ID">
                        <button type="button" class="btn btn-outline-primary" 
                            v-if="form.operacion === 'Modificación'" 
                            @click="buscarProducto" 
                            :disabled="cargandoProducto">
                            {{ cargandoProducto ? 'Buscando...' : 'Buscar' }}
                        </button>
                    </div>
                    <div class="text-success small mt-1" v-if="datosOriginales && form.operacion === 'Modificación'">✓ Producto cargado — modifica los campos que necesites</div>
                </div>

                <div class="form-group mb-3" v-if="form.operacion !== 'Eliminación'">
                    <input type="text" class="form-control"
                    placeholder="Ej: Sofá Rojo"
                    v-model="form.nombre"
                    :class="{
                        'is-invalid': errores.nombre || errores.nombreDuplicado, 
                        'is-valid': form.nombre.length >= 4 && !errores.nombre && nombreDisponible
                    }">
                <div class="invalid-feedback" v-if="errores.nombre">El nombre debe tener al menos 4 caracteres</div>
                <div class="invalid-feedback" v-if="errores.nombreDuplicado">Este nombre ya existe en la base de datos</div>
                <div class="text-info small" v-if="cargandoValidacion">Verificando disponibilidad...</div>
                </div>

                <div class="form-group mb-3" v-if="form.operacion !== 'Eliminación'">
                    <label>Categoría</label>
                    <select class="form-control" v-model="form.categoria">
                        <option value="">Selecciona</option>
                        <option>Salas</option>
                        <option>Comedores</option>
                        <option>Oficina</option>
                    </select>
                </div>

                <div class="form-group mb-3" v-if="form.operacion !== 'Eliminación'">
                    <label>Precio</label>
                    <input type="number" class="form-control"
                    placeholder="Ej: 10000"
                    v-model="form.precio"
                    :class="{
                        'is-invalid': errores.precio, 
                        'is-valid': form.precio > 0 && !errores.precio
                    }">
                <div class="invalid-feedback">El precio debe ser un número positivo</div>
                </div>

                <div class="form-group mb-3" v-if="form.operacion !== 'Eliminación'">
                    <label>Descripción</label>
                    <textarea class="form-control"
                        placeholder="Describe el producto..."
                        v-model="form.descripcion"
                        :class="{'is-invalid': errores.descripcion, 'is-valid': form.descripcion}">
                    </textarea>
                    <div class="invalid-feedback">Campo obligatorio (min 10 caracteres)</div>
                </div>

                <div class="form-group mb-3" v-if="form.operacion !== 'Eliminación'">
                    <label>Subir Imagen del Mueble</label>
                    <input type="file" class="form-control" @change="manejarArchivo" accept="image/*">
                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Procesar {{ form.operacion }}
                </button>

            </form>
        </div>

        <!-- Alerta Flotante Estilo Catálogo -->
        <div v-if="alertaVisible"
            :class="'alert ' + alertaClase + ' position-fixed top-0 start-50 translate-middle-x mt-4 shadow-lg d-flex align-items-center'"
            style="z-index: 2000; min-width: 350px; border-radius: 12px;" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                class="bi bi-check-circle-fill me-3" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
            </svg>
            <div>{{ mensajeAlerta }}</div>
        </div>
    </script>

    <footer>
    </footer>

<script src="https://unpkg.com/vue@3"></script>
<script src="js/shared.js"></script>
<script src="js/script_formulario.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
