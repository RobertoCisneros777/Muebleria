<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Muebles Nova</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <header></header>

    <main class="container py-5">
        <div class="login-container animacion-entrada" style="max-width: 500px; margin: 0 auto; padding: 2rem; background-color: #fff; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2 class="text-center mb-4 fw-bold">Crear Cuenta</h2>
            <p class="text-center text-muted mb-4">Únete a Muebles Nova</p>

            <form id="registroForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required placeholder="Tu nombre">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" required placeholder="Tu apellido">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" required placeholder="tu@email.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn btn-dark w-100 mb-3">Registrarse</button>
                <div id="mensajeError" class="text-danger text-center mt-3" style="display: none;"></div>
                <div id="mensajeExito" class="text-success text-center mt-3" style="display: none;"></div>
                
                <div class="text-center mt-3">
                    <span class="text-muted">¿Ya tienes una cuenta? </span>
                    <a href="login.html" class="text-dark fw-bold text-decoration-none">Inicia sesión aquí</a>
                </div>
            </form>
        </div>
    </main>

    <footer></footer>

    <script src="js/shared.js"></script>
    <script src="js/script_registro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
