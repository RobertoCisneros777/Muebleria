<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Muebles Nova</title>

    <link rel="stylesheet" href="https://julian12pm.github.io/FORMULARIO-CSS/Formulario.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div id="app">

    <header>
        <h1>Administración de Productos</h1>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
                <li><a href="catalogo.html">Ir al Catálogo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Gestión de Productos</h2>

            <form @submit.prevent="validarFormulario">

                <div class="form-group mb-3">
                    <label>Tipo de operación</label>
                    <select class="form-control" v-model="form.operacion">
                        <option value="">Selecciona</option>
                        <option>Alta</option>
                        <option>Modificación</option>
                        <option>Eliminación</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <input type="text" class="form-control"
                    placeholder="Ej: Sofá Rojo"
                    v-model="form.nombre"
                    :class="{
                        'is-invalid': errores.nombre, 
                        'is-valid': form.nombre.length >= 4 && !errores.nombre
                    }">
                <div class="invalid-feedback">El nombre debe tener al menos 4 caracteres</div>
                </div>

                <div class="form-group mb-3">
                    <label>Categoría</label>
                    <select class="form-control" v-model="form.categoria">
                        <option value="">Selecciona</option>
                        <option>Sala</option>
                        <option>Comedor</option>
                        <option>Oficina</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label>Precio</label>
                    <input type="number" class="form-control"
                    placeholder="Ej: 10000"
                    v-model="form.precio"
                    :class="{
                        'is-invalid': errores.precio, 
                        'is-valid': form.precio > 0 && !errores.precio
                    }">
                <div class="invalid-feedback">El precio debe ser un número positivo</div>
                </div>

                <div class="form-group mb-3">
                    <label>Descripción</label>
                    <textarea class="form-control"
                        placeholder="Describe el producto..."
                        v-model="form.descripcion"
                        :class="{'is-invalid': errores.descripcion, 'is-valid': form.descripcion}">
                    </textarea>
                    <div class="invalid-feedback">Campo obligatorio</div>
                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Guardar Cambios
                </button>

                <p v-if="exito" class="text-success text-center mt-3">
                    Guardado con exito
                </p>

            </form>
        </div>
    </main>

    <footer>
    </footer>

</div>

<script src="https://unpkg.com/vue@3"></script>
<script src="script/shared.js"></script>
<script src="script/script_formulario.js"></script>

</body>
</html>
