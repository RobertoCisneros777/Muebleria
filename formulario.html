<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Muebles Nova</title>

    <link rel="stylesheet" href="https://julian12pm.github.io/FORMULARIO-CSS/Formulario.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div id="app">

    <header>
        <h1>Administración de Productos</h1>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
                <li><a href="catalogo.html">Ir al Catálogo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Gestión de Productos</h2>

            <form @submit.prevent="validarFormulario">

                <div class="form-group mb-3">
                    <label>Tipo de operación</label>
                    <select class="form-control" v-model="form.operacion">
                        <option value="">Selecciona</option>
                        <option>Alta</option>
                        <option>Modificación</option>
                        <option>Eliminación</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label>Nombre del producto</label>
                    <input type="text" class="form-control"
                        placeholder="Ej: Sofá Rojo"
                        v-model="form.nombre"
                        :class="{'is-invalid': errores.nombre, 'is-valid': form.nombre}">
                    <div class="invalid-feedback">Campo obligatorio</div>
                </div>

                <div class="form-group mb-3">
                    <label>Categoría</label>
                    <select class="form-control" v-model="form.categoria">
                        <option value="">Selecciona</option>
                        <option>Sala</option>
                        <option>Comedor</option>
                        <option>Oficina</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label>Precio</label>
                    <input type="number" class="form-control"
                        placeholder="Ej: 10000"
                        v-model="form.precio"
                        :class="{'is-invalid': errores.precio, 'is-valid': form.precio}">
                    <div class="invalid-feedback">Solo números válidos</div>
                </div>

                <div class="form-group mb-3">
                    <label>Descripción</label>
                    <textarea class="form-control"
                        placeholder="Describe el producto..."
                        v-model="form.descripcion"
                        :class="{'is-invalid': errores.descripcion, 'is-valid': form.descripcion}">
                    </textarea>
                    <div class="invalid-feedback">Campo obligatorio</div>
                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Guardar Cambios
                </button>

                <p v-if="exito" class="text-success text-center mt-3">
                    Guardado con exito
                </p>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Muebles Nova. All rights reserved</p>

        <p>
            <a href="https://validator.w3.org/nu/?doc=https://robertocisneros777.github.io/Muebleria/formulario.html">
                <img src="https://www.w3.org/Icons/valid-html401" alt="Valid HTML!" height="31" width="88">
            </a>
        </p>

        <p>
            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https://julian12pm.github.io/FORMULARIO-CSS/Formulario.css">
                <img style="border:0;width:88px;height:31px"
                    src="https://jigsaw.w3.org/css-validator/images/vcss"
                    alt="¡CSS Válido!">
            </a>
        </p>
    </footer>

</div>

<script src="https://unpkg.com/vue@3"></script>

<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            form: {
                operacion: '',
                nombre: '',
                categoria: '',
                precio: '',
                descripcion: ''
            },
            errores: {},
            exito: false
        }
    },
    methods: {
        validarFormulario() {
            this.errores = {};
            this.exito = false;

            if (!this.form.nombre) {
                this.errores.nombre = true;
            }

            if (!this.form.precio || this.form.precio <= 0) {
                this.errores.precio = true;
            }

            if (!this.form.descripcion) {
                this.errores.descripcion = true;
            }

            if (Object.keys(this.errores).length === 0) {
                this.exito = true;
            }
        }
    }
}).mount('#app');
</script>

</body>
</html>
